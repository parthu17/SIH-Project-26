<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset="UTF-8"/>
        <title>AGHI Foundation</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <link rel="stylesheet" href="centre_styles.css">
    </head>
    <body>
        <header id="top-header"><h1>GHI Foundation</h1></header>
        <main id="main-content">
            <p id="location">📍 Karimnagar</p>
            <p id="overall-ranking">🟢 Currently Compliant</p>
            <p>Last Inspection</p>
            <p id="last-inspection-date">26 August 2026</p>
            <div id="caseUpdateShower" class="web-flyer">
                <div class="caseUpdater">
                    <p>Inspections</p>
                    <p class="casecurrnum">15</p>
                </div>
                <div class="caseUpdater">
                    <p>Issues</p>
                    <p class="casecurrnum">1</p>
                </div>
                <div class="caseUpdater">
                    <p>Compliance</p>
                    <p class="casecurrnum">97%</p>
                </div>
            </div>
            <div id="inspection-history-div" class="web-flyer">
                <h2>Inspection History</h2>
                <table id="inspection-history-table">
                    <tbody>
                        <tr>
                            <th>26 Aug</th>
                            <td>✅ Completed</td>
                        </tr>
                        <tr>
                            <th>21 Aug</th>
                            <td>✅ Completed</td>
                        </tr>
                        <tr>
                            <th>04 Aug</th>
                            <td>✅ Completed</td>
                        </tr>
                        <tr>
                            <th>18 Jul</th>
                            <td>✅ Completed</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="recent-issues-div" class="web-flyer">
                    <h2>Recent Issues</h2>
                    <p id="issue">No issues</p>
                    <p id="issue-status">Status:</p>
            </div>
        </main>
        <footer>
            <div id="latest-inspection">
                <p>View Latest Inspection</p>
            </div>
        </footer>
    </body>
</html>
