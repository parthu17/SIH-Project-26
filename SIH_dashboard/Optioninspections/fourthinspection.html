<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <title>Inspections</title>
        <link rel="stylesheet" href="./inspect_styles.css"/>
    </head>
    <body>
        <header id="top-header"><h1>Inspection #1896</h1></header>
        <main id="main-content">
            <div id="details-div" class="web-flyer">
                <h2>Details</h2>
                <div id="insitute-details">
                    <p id="name-institute">GHI Centre</p>
                    <p id="inspection-date">02 Aug 2026</p>
                </div>
                <div id="inspection-details">
                    <p id="inspector-name">Inspector: Deepa</p>
                    <p id="inspection-status">Status: Good</p>
                </div>
            </div>
            <div id="location-div" class="web-flyer">
                <h2>📍 Location</h2>
                <p id="location-coordinates">11.xxxx, 74.xxxx</p>
                <p id="location-verification">✅ Location verified</p>
            </div>
            <div id="checklist"class="web-flyer">
                <h2>Checklist</h2>
                <p>✅ Staff Present</p>
                <p>✅ Beneficiary count</p>
                <p>❌ Documents Verified</p>
            </div>
            <div id="evidence-div" class="web-flyer">
                <!--Important-->
                <h2>Evidence</h2>
                <p><a href="evidence.pdf" download="evidence.pdf">Download pdf</a></p>
            </div>
            <div id="observations-div">
                <h2>Observations:</h2>
                <p id="observation-p">"Documents yet to be verified"</p>
            </div>
        </main>
        <footer>
            <div id="create-issue-div">
                <p>Create Issue</p>
            </div>
        </footer>
    </body>
</html>
