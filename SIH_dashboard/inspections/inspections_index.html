<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <title>Inspections</title>
        <link rel="stylesheet" href="./inspections_styles.css"/>
        <link rel="stylesheet" href="../institutions/institutions_styles.css"/>
    </head>
    <body>
        <header id="top-header">
            <h1>Inspections</h1>
        </header>
        <h2>Manage and monitor inspections</h2>
        <main id="main-content">
            <form>
                <div id="search-div">
                    <label for="search_bar">Search:</label>
                    <input type="text" id="search_bar" placeholder="🔍"/>
                </div>
                <div id="radio-div">
                    <input type="radio" id="ascending-radio" name="order"/>
                    <label for="ascending-radio">Completed to Pending</label>
                    <input type="radio" id="descending-radio" name="order"/>
                    <label for="descending-radio">Pending to Completed</label>
                </div>
            </form>
            <table id="inspection-table">
                <tbody>
                    <tr>
                        <th>Inspection</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                    <tr id="op-1" class="table-options">
                        <th>Inspection #1024</th>
                        <td>Hyd</td>
                        <td>✅ Completed</td>
                         <td>05 Sep</td>
                    </tr>
                    <tr id="op-2" class="table-options">
                        <th>Inspection #1156</th>
                        <td>Warangal</td>
                        <td>⚠️ Not Complied</td>
                        <td>26 Aug</td>
                    </tr>
                   <tr id="op-3" class="table-options">
                        <th>Inspection #2378</th>
                        <td>Nizamabad</td>
                        <td>⏳ Pending</td>
                        <td>28 Aug</td>
                    </tr>
                    <tr id="op-4" class="table-options">
                        <th>Inspection #1896</th>
                        <td>Karimnagar</td>
                        <td>✅ Completed</td>
                        <td>05 Sep</td>
                    </tr> 
                </tbody>
            </table>
            
        </main>
        <footer>
            <div id="page-nos"><span id="one" class="page-no">1</span><span id="two" class="page-no">2</span><span id="three" class="page-no">3</span><span id="four" class="page-no">4</span><span id="arrow" class="page-no">→</span></div>
        </footer>
        
    </body>
    <script src="../inspections/inspections_funct.js"></script>
</html>
